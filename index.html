<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSphere </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="./src/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="m-0 p-0">
    <main class=" grid grid-cols-[23%_77%] h-screen w-full">

        <!-- employees -->
        <section class="bg-gray-200 rounded-[10px] p-4 m-2 overflow-y-auto">
            <h1 class="text-2xl text-center font-bold p-2 mb-2">WorkSphere</h1>
            <button id="add-employee"
                class="w-full cursor-pointer bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg mb-4">
                + Add New Employee
            </button>

            <!-- Employees list-->
            <div id="employee-list"></div>

        </section>

        <!-- Plan -->
        <section class="h-full flex items-center pr-2">
            <div class="relative w-full h-[94vh] shadow-lg">

                <img src="./assets/img/plan.jpg" alt="worksphere" class="w-full h-full absolute z-0">

                <div class="absolute inset-0 grid grid-cols-[38.2%_16%_23%_22.6%] grid-rows-[34%_32.8%_33.1%] z-10">

                    <!-- Conference Room -->
                    <div class="border-r-8 border-b-8 p-3">
                        <div class="flex flex-col h-full">
                            <h2 class="text-xs font-semibold text-gray-700 mb-1 text-center">
                                Conference Room
                            </h2>

                            <div id="conference-employees" class="grid grid-cols-2 gap-2 flex-1 items-center p-2 ">
                                <!-- employees will be here with js -->


                            </div>

                            <!-- Add button -->
                            <div class="flex justify-center ">
                                <button id="addBtn-conference"
                                    class="w-8 h-6 bg-blue-500 text-center hover:bg-blue-700 text-white rounded-[5px] cursor-pointer">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- hallway -->
                    <div class="row-span-3 "></div>

                    <!-- Servers Room -->
                    <div class="bg-red-400/40 border-b-8 border-l-8 border-r-8 p-6">
                        <div class="flex flex-col h-full">
                            <h2 class="text-xs font-semibold text-gray-700 mb-1 text-center">
                                Server Room
                            </h2>

                            <div id="server-employees" class="grid grid-rows-2 gap-2 flex-1 items-center p-2 ">
                                <!-- employees will be here with js -->


                            </div>

                            <!-- Add button -->
                            <div class="flex justify-center ">
                                <button id="addBtn-server"
                                    class="w-8 h-6 bg-blue-500 text-center hover:bg-blue-700 text-white rounded-[5px] cursor-pointer">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- Security Room -->
                    <div class="bg-red-400/40 border-b-8 p-6">
                        <div class="flex flex-col h-full">
                            <h2 class="text-xs font-semibold text-gray-700 mb-1 text-center">
                                Security Room
                            </h2>

                            <div id="security-employees" class="grid grid-rows-2 gap-2 flex-1 items-center p-2 ">
                                <!-- employees will be here with js -->


                            </div>

                            <!-- Add button -->
                            <div class="flex justify-center ">
                                <button id="addBtn-security"
                                    class="w-8 h-6 bg-blue-500 text-center hover:bg-blue-700 text-white rounded-[5px] cursor-pointer">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- Reception -->
                    <div class="bg-red-400/40 row-span-2 border-r-8 p-20">
                        <div class="flex flex-col h-full">
                            <h2 class="text-xs font-semibold text-gray-700 mb-1 text-center">
                                Reception Room
                            </h2>

                            <div id="reception-employees" class="grid grid-cols-2 gap-2 flex-1 items-center p-2 ">
                                <!-- employees will be here with js -->


                            </div>

                            <!-- Add button -->
                            <div class="flex justify-center ">
                                <button id="addBtn-reception"
                                    class="w-8 h-6 bg-blue-500 text-center hover:bg-blue-700 text-white rounded-[5px] cursor-pointer">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- hallway -->
                    <div class="col-span-2"></div>

                    <!-- Staff Room -->
                    <div class="border-l-8 border-t-8 border-r-8 p-6">
                        <div class="flex flex-col h-full">
                            <h2 class="text-xs font-semibold text-gray-700 mb-1 text-center">
                                staff Room
                            </h2>

                            <div id="staff-employees" class="grid grid-cols-2 gap-2 flex-1 items-center p-2 ">
                                <!-- employees will be here with js -->


                            </div>

                            <!-- Add button -->
                            <div class="flex justify-center ">
                                <button id="addBtn-staff"
                                    class="w-8 h-6 bg-blue-500 text-center hover:bg-blue-700 text-white rounded-[5px] cursor-pointer">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- Archive -->
                    <div class="bg-red-400/40 border-t-8 p-6">
                        <div class="flex flex-col h-full">
                            <h2 class="text-xs font-semibold text-gray-700 mb-1 text-center">
                                Archive Room
                            </h2>

                            <div id="archive-employees" class="grid grid-rows-2 gap-2 flex-1 items-center p-2 ">
                                <!-- employees will be here with js -->


                            </div>

                            <!-- Add button -->
                            <div class="flex justify-center ">
                                <button id="addBtn-archive"
                                    class="w-8 h-6 bg-blue-500 text-center hover:bg-blue-700 text-white rounded-[5px] cursor-pointer">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>
    <!-- form -->
    <section id="form-container" class="font-inter">
        <div id="employee-modal" class="fixed inset-0 z-50 bg-black/40 flex items-center justify-center hidden">

            <!-- Scrolle Bar Inside -->
            <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden">
                <div class="max-h-[90vh] overflow-y-auto p-6">
                    <div class="flex justify-between mb-4">
                        <h2 class="text-2xl font-bold text-gray-800">Employee Form</h2>
                        <button id="close-modal"
                            class="text-gray-950 hover:text-blue-800 text-2xl cursor-pointer">&times;</button>
                    </div>

                    <!-- Employee Form -->
                    <form id="form" action="">
                        <!-- Name -->
                        <div class="mb-2">
                            <label class="text-sm font-semibold text-gray-800">Name:</label><br>
                            <input id="first-name"
                                class="w-full text-sm mt-1 px-3 py-2 border rounded border-black/40 focus:outline-none focus:border-2 focus:border-black/60"
                                type="text" placeholder="Enter your Name">
                        </div>

                        <!-- lastname -->
                        <div class="mb-2">
                            <label class="text-sm font-semibold text-gray-800">Lastname:</label>
                            <input id="last-name"
                                class="w-full text-sm mt-1 px-3 py-2 border rounded border-black/40 focus:outline-none focus:border-2 focus:border-black/60"
                                type="text" placeholder="Enter your Lastname">
                        </div>

                        <!-- Email -->
                        <div class="mb-2">
                            <label class="text-sm font-semibold text-gray-800">Email:</label>
                            <input id="email"
                                class="w-full text-sm mt-1 px-3 py-2 border rounded border-black/40 focus:outline-none focus:border-2 focus:border-black/60"
                                type="email" placeholder="Enter youe Email">
                        </div>

                        <!-- Phone -->
                        <div class="mb-2">
                            <label class="text-sm font-semibold text-gray-800">Phone:</label>
                            <input id="phone"
                                class="w-full text-sm  mt-1 px-3 py-2 border rounded border-black/40 focus:outline-none focus:border-2 focus:border-black/60"
                                type="tel" placeholder="Enter your Number">
                        </div>

                        <!-- Role -->
                        <div class="mb-2">
                            <label class="text-sm font-semibold text-gray-800">Role:</label>
                            <select id="role"
                                class="w-full text-sm mt-1 px-3 py-2 border rounded border-black/40 focus:outline-none focus:border-2 focus:border-black/60">
                                <option disabled selected>Select a role</option>
                                <option>Receptionist</option>
                                <option>IT Technician</option>
                                <option>Manager</option>
                                <option>Security Guard</option>
                                <option>Cleaner</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <!-- photo -->
                        <div class="mb-4">
                            <label class="text-sm font-semibold text-gray-800">Photo:</label>
                            <div
                                class="mt-3 w-32 h-32 bg-gray-200 border border-gray-300 rounded-full flex justify-start">
                                <img id="photo-preview" src="./assets/img/profile-photo.jpg"
                                    class="w-full h-full object-cover rounded-full" alt="profile image">
                            </div>
                            <label class="text-sm text-gray-800">URL:</label>
                            <input id="photo-url"
                                class="w-full text-sm mt-1 px-3 py-2 border rounded border-black/40 focus:outline-none focus:border-2 focus:border-black/60"
                                type="url" placeholder="https://example.com/photo.jpg">
                        </div>

                        <!-- Experience -->
                        <div id="experience-container">
                            <div id="experience-modal"
                                class="mb-4 rounded-lg bg-gray-100 border border-gray-300 px-3 py-3">
                                <!-- Company Name -->
                                <div class=" mb-2">
                                    <label class="text-sm font-semibold text-gray-800">Company Name:</label>
                                    <input data-company
                                        class="w-full text-sm mt-1 px-3 py-2 border rounded border-black/40 focus:outline-none focus:border-2 focus:border-black/60"
                                        type="text" placeholder="Company Name">
                                </div>
                                <!-- Experience Role -->
                                <div class="mb-2">
                                    <label class="text-sm font-semibold text-gray-800">Role:</label>
                                    <select data-roleExp
                                        class="w-full text-sm mt-1 px-3 py-2 border rounded border-black/40 focus:outline-none focus:border-2 focus:border-black/60 ">
                                        <option disabled selected>Select a role</option>
                                        <option>Receptionist</option>
                                        <option>IT Technician</option>
                                        <option>Manager</option>
                                        <option>Security Guard</option>
                                        <option>Cleaner</option>
                                        <option>Other</option>
                                    </select>
                                </div>
                                <!-- date -->
                                <div class="mb-2 flex items-center gap-4">
                                    <!-- From -->
                                    <div class="flex items-center gap-2 w-full">
                                        <label class="text-sm font-semibold text-gray-800">From</label>
                                        <input data-from type="date"
                                            class="flex-1 text-sm mt-1 px-3 py-2 border rounded border-black/40 focus:outline-none focus:border-2 focus:border-black/60">
                                    </div>
                                    <!-- To -->
                                    <div class="flex items-center gap-2 w-full">
                                        <label class="text-sm font-semibold text-gray-800">To</label>
                                        <input data-to type="date"
                                            class="flex-1 text-sm mt-1 px-3 py-2 border rounded border-black/40 focus:outline-none focus:border-2 focus:border-black/60">
                                    </div>
                                </div>
                                <!-- Description -->
                                <div>
                                    <label class="text-sm font-semibold text-gray-800">Description:</label>
                                    <textarea rows="4" data-desc
                                        class="w-full text-sm px-3 py-2 border rounded border-black/40 focus:outline-none focus:border-2 focus:border-black/60"
                                        placeholder="Description..."></textarea>
                                </div>
                            </div>
                        </div>
                        <button type="button" id="add-experience-btn"
                            class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg mb-4 cursor-pointer">
                            + Add Experience
                        </button>

                        <!-- Submit Button -->
                        <button type="submit"
                            class="w-full cursor-pointer bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg mb-4">
                            Submit
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </section>

    <!-- Conference Select Modal -->
    <section id="room-modal" class="fixed inset-0 z-50 bg-black/40 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
            <div class="max-h-[70vh] overflow-y-auto p-4">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold text-gray-800">Select Employees</h2>
                    <button id="close-room-modal"
                        class="text-gray-950 hover:text-blue-800 text-2xl cursor-pointer">&times;</button>
                </div>
                <div id="room-list" class="space-y-2">
                    <!-- emolyees will be here -->
                </div>
            </div>
        </div>
    </section>

    <script src="./js/script.js"></script>
</body>

</html>
